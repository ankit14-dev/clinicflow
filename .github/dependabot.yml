# Weekly PRs for outdated dependencies; each PR runs the full pipeline (tests + Trivy) before merge.
version: 2
updates:
  - package-ecosystem: github-actions   # bumps the pinned action SHAs too
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: {interval: weekly}
    ignore:
      # base image majors (Node 25 is not LTS, new Python/nginx lines) are upgraded deliberately, not by bot
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /terraform
    schedule: {interval: monthly}
