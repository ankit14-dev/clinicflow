# helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --version 4.15.1 \
#   -n ingress-nginx --create-namespace -f monitoring/ingress-nginx-values.yaml
# The controller is what actually implements Ingress resources; on EKS its Service gets an AWS NLB.
controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true          # Prometheus also scrapes request metrics at the edge
  resources:
    requests: {cpu: 50m, memory: 96Mi}
