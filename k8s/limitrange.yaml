# Default requests/limits for any container in the namespace that does not declare its own
# (e.g. the troubleshooting labs), so nothing runs unbounded and HPA math always has a request.
apiVersion: v1
kind: LimitRange
metadata:
  name: clinicflow-defaults
  namespace: clinicflow
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 250m, memory: 256Mi}
