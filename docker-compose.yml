# Full local stack: PostgreSQL + FastAPI backend + React/nginx frontend
#   docker compose up --build      ->  http://localhost:3000   (API docs: http://localhost:8000/docs)
#   docker compose down -v         ->  stop and delete the database volume
name: clinicflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow-local}   # override in a .env file; never commit real ones
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"   # for psql / DBeaver during the demo, localhost only

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: clinicflow-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://clinicflow:${POSTGRES_PASSWORD:-clinicflow-local}@postgres:5432/clinicflow
      ENVIRONMENT: docker-compose
      CLINIC_TIMEZONE: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: clinicflow-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
