# Classroom setup: PostgreSQL inside the cluster on a PersistentVolume.
# Production alternative: Amazon RDS (managed backups, Multi-AZ, patching) — see README "Design decisions".
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicflow.fullname" . }}-postgres
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None   # headless: stable DNS name for the StatefulSet pod
  selector: {{- include "clinicflow.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clinicflow.fullname" . }}-postgres
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "clinicflow.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "clinicflow.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clinicflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # the postgres user in the Alpine image
        fsGroup: 70          # make the mounted volume writable for it
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: {{ include "clinicflow.fullname" . }}-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: {{ include "clinicflow.fullname" . }}-config, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "clinicflow.secretName" . }}, key: postgres-password}}
            - name: PGDATA           # subdirectory: a fresh EBS volume contains lost+found at its root
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - {name: run, mountPath: /var/run/postgresql}   # unix socket + lock file
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
