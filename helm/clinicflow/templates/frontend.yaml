apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinicflow.fullname" . }}-frontend
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "clinicflow.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clinicflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "clinicflow.podDefaults" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "clinicflow.selector" (dict "root" . "component" "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: {{ include "clinicflow.image" (dict "image" .Values.frontend.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.frontend.port }}}
          env:
            - name: BACKEND_URL
              value: "http://{{ include "clinicflow.fullname" . }}-backend:8000"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicflow.fullname" . }}-frontend
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector: {{- include "clinicflow.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
