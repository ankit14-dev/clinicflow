{{- if not .Values.postgresql.existingSecret }}
{{- $name := printf "%s-db" (include "clinicflow.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete the DB password together with the release
type: Opaque
data:
  {{- if $existing }}
  postgres-password: {{ index $existing.data "postgres-password" }}
  {{- else }}
  postgres-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
