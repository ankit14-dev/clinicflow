apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinicflow.fullname" . }}-backend
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  selector:
    matchLabels: {{- include "clinicflow.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clinicflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "clinicflow.podDefaults" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:       # spread replicas over nodes, but never block scheduling
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "clinicflow.selector" (dict "root" . "component" "backend") | nindent 14 }}
      initContainers:
        - name: wait-for-db            # avoid crash-restarts while PostgreSQL is still starting
          image: {{ .Values.postgresql.image }}
          command: ["sh", "-c", "until pg_isready -h $(POSTGRES_HOST) -U $(POSTGRES_USER); do echo waiting for database; sleep 2; done"]
          envFrom:
            - configMapRef: {name: {{ include "clinicflow.fullname" . }}-config}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      containers:
        - name: backend
          image: {{ include "clinicflow.image" (dict "image" .Values.backend.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.backend.port }}}
          envFrom:
            - configMapRef: {name: {{ include "clinicflow.fullname" . }}-config}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "clinicflow.secretName" . }}, key: postgres-password}}
            - name: DATABASE_URL        # $(VAR) is expanded by Kubernetes from the variables above
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
          startupProbe:                 # Alembic migrations run before Uvicorn starts listening
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:               # /ready also checks the database: no DB, no traffic
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                # /health only: a DB outage must not restart every pod
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicflow.fullname" . }}-backend
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector: {{- include "clinicflow.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
