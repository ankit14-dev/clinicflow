apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinicflow.fullname" . }}-config
  labels: {{- include "clinicflow.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  APP_VERSION: {{ .Values.backend.image.tag | default .Chart.AppVersion | quote }}
  CLINIC_TIMEZONE: {{ .Values.clinicTimezone | quote }}
  {{- if .Values.ingress.host }}
  CORS_ORIGINS: {{ printf "http://%s,https://%s" .Values.ingress.host .Values.ingress.host | quote }}
  {{- else }}
  CORS_ORIGINS: "*"   # same-origin via Ingress; no fixed host to restrict to
  {{- end }}
  POSTGRES_HOST: {{ include "clinicflow.fullname" . }}-postgres
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
