# helm upgrade --install argocd argo/argo-cd --version 10.10.5 -n argocd --create-namespace -f argocd/argocd-values.yaml
# UI: kubectl port-forward -n argocd svc/argocd-server 8080:80  ->  http://localhost:8080  (user admin)
#     password: kubectl get secret -n argocd argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
configs:
  params:
    server.insecure: true            # TLS terminates at the port-forward / ingress, not in argocd-server
  cm:
    timeout.reconciliation: 60s      # poll git every minute (default 3 min) so a push shows up quickly in the demo
    application.resourceTrackingMethod: annotation   # never claim resources just because they share a label

dex:
  enabled: false                     # local admin login only
notifications:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
applicationSet:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
